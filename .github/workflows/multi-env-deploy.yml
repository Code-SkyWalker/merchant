name: Deploy to Multiple Environments

on:
  push:
    branches:
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
      - master
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for manual deployment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [dev, prod]
    outputs:
      dev-jar: ${{ steps.build-dev.outputs.jar-path }}
      prod-jar: ${{ steps.build-prod.outputs.jar-path }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven (${{ matrix.profile }})
      id: build-${{ matrix.profile }}
      run: |
        mvn clean package -P${{ matrix.profile }} -DskipTests
        echo "Build completed successfully for ${{ matrix.profile }} profile"
        echo "jar-path=ruoyi-admin/target/ruoyi-admin.jar" >> $GITHUB_OUTPUT

    - name: Upload ${{ matrix.profile }} JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruoyi-admin-${{ matrix.profile }}
        path: ruoyi-admin/target/ruoyi-admin.jar

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/develop' || 
      github.event_name == 'workflow_dispatch' && 
      inputs.environment == 'staging'
    environment: staging
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ruoyi-admin-dev
        path: target/

    - name: Deploy to staging via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        password: ${{ secrets.STAGING_PASSWORD }}
        port: ${{ secrets.STAGING_PORT }}
        source: "target/ruoyi-admin.jar"
        target: "/opt/ruoyi-vue-plus-staging/"
        strip_components: 2
        overwrite: true

    - name: Restart staging application via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        password: ${{ secrets.STAGING_PASSWORD }}
        port: ${{ secrets.STAGING_PORT }}
        script: |
          # Stop the existing application
          sudo systemctl stop ruoyi-vue-plus-staging || echo "Service not running or does not exist"
          
          # Backup current version
          if [ -f /opt/ruoyi-vue-plus-staging/ruoyi-admin.jar.bak ]; then
            rm /opt/ruoyi-vue-plus-staging/ruoyi-admin.jar.bak
          fi
          
          if [ -f /opt/ruoyi-vue-plus-staging/ruoyi-admin.jar ]; then
            cp /opt/ruoyi-vue-plus-staging/ruoyi-admin.jar /opt/ruoyi-vue-plus-staging/ruoyi-admin.jar.bak
          fi
          
          # Start the application
          sudo systemctl start ruoyi-vue-plus-staging || echo "Failed to start service with systemctl, trying manual start"
          
          # If systemctl doesn't work, start manually with nohup
          if ! sudo systemctl is-active --quiet ruoyi-vue-plus-staging; then
            echo "Starting application manually..."
            cd /opt/ruoyi-vue-plus-staging/
            nohup java -Dspring.profiles.active=dev -jar ruoyi-admin.jar > app.log 2>&1 &
            echo "Application started manually"
          fi
          
          # Wait a moment for the application to start
          sleep 10
          
          # Check if the application is running
          if pgrep -f "ruoyi-vue-plus-staging" > /dev/null; then
            echo "Staging application is running successfully"
          else
            echo "Staging application may not be running properly"
            exit 1
          fi

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/master' || 
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && 
      inputs.environment == 'production'
    environment: production
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ruoyi-admin-prod
        path: target/

    - name: Deploy to production via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        password: ${{ secrets.PROD_PASSWORD }}
        port: ${{ secrets.PROD_PORT }}
        source: "target/ruoyi-admin.jar"
        target: "/opt/ruoyi-vue-plus/"
        strip_components: 2
        overwrite: true

    - name: Restart production application via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        password: ${{ secrets.PROD_PASSWORD }}
        port: ${{ secrets.PROD_PORT }}
        script: |
          # Stop the existing application
          sudo systemctl stop ruoyi-vue-plus || echo "Service not running or does not exist"
          
          # Backup current version
          if [ -f /opt/ruoyi-vue-plus/ruoyi-admin.jar.bak ]; then
            rm /opt/ruoyi-vue-plus/ruoyi-admin.jar.bak
          fi
          
          if [ -f /opt/ruoyi-vue-plus/ruoyi-admin.jar ]; then
            cp /opt/ruoyi-vue-plus/ruoyi-admin.jar /opt/ruoyi-vue-plus/ruoyi-admin.jar.bak
          fi
          
          # Start the application
          sudo systemctl start ruoyi-vue-plus || echo "Failed to start service with systemctl, trying manual start"
          
          # If systemctl doesn't work, start manually with nohup
          if ! sudo systemctl is-active --quiet ruoyi-vue-plus; then
            echo "Starting application manually..."
            cd /opt/ruoyi-vue-plus/
            nohup java -Dspring.profiles.active=prod -jar ruoyi-admin.jar > app.log 2>&1 &
            echo "Application started manually"
          fi
          
          # Wait a moment for the application to start
          sleep 10
          
          # Check if the application is running
          if pgrep -f "ruoyi-vue-plus" > /dev/null; then
            echo "Production application is running successfully"
          else
            echo "Production application may not be running properly"
            exit 1
          fi