name: Deploy to CentOS 7.9 Server

on:
  push:
    branches: [ main, master, 5.x ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_NAME: ruoyi-vue-plus
  JAR_FILE: ruoyi-admin.jar
  DEPLOY_PATH: /opt/ruoyi-vue-plus
  DEPLOY_USER: appuser

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build with Maven
      run: |
        mvn clean package -D skipTests -P dev
        echo "Build completed successfully"

    - name: Verify JAR file exists
      run: |
        if [ ! -f "ruoyi-admin/target/ruoyi-admin.jar" ]; then
          echo "Error: JAR file not found!"
          ls -la ruoyi-admin/target/
          exit 1
        fi
        echo "JAR file found: $(ls ruoyi-admin/target/ruoyi-admin.jar)"

    - name: Deploy to CentOS Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT || 22 }}
        source: "ruoyi-admin/target/ruoyi-admin.jar"
        target: "${{ env.DEPLOY_PATH }}"
        strip_components: 2
        overwrite: true

    - name: Execute remote deployment commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          # ========================
          # 部署脚本开始执行
          # ========================

          # 创建部署用户（如果不存在）
          # 检查DEPLOY_USER是否已存在，不存在则创建该用户
          if ! id "${{ env.DEPLOY_USER }}" &>/dev/null; then
            echo "Creating deploy user: ${{ env.DEPLOY_USER }}"
            sudo useradd -m -s /bin/bash ${{ env.DEPLOY_USER }}
          fi

          # 设置JAR文件的正确权限
          # 将JAR文件的所有者设置为DEPLOY_USER，并赋予执行权限
          sudo chown ${{ env.DEPLOY_USER }}:${{ env.DEPLOY_USER }} ${{ env.DEPLOY_PATH }}/${{ env.JAR_FILE }}
          sudo chmod +x ${{ env.DEPLOY_PATH }}/${{ env.JAR_FILE }}
          echo "Set permissions for ${{ env.DEPLOY_PATH }}/${{ env.JAR_FILE }}"

          # 创建当前版本的备份（如果存在）
          # 如果存在旧的备份文件，则删除它
          if [ -f "${{ env.DEPLOY_PATH }}/ruoyi-admin.jar.bak" ]; then
            echo "Removing old backup file..."
            rm -f ${{ env.DEPLOY_PATH }}/ruoyi-admin.jar.bak
          fi

          # 如果存在当前运行的JAR文件且不是同一个文件，则创建备份
          if [ -f "${{ env.DEPLOY_PATH }}/ruoyi-admin.jar" ] && [ ! "${{ env.DEPLOY_PATH }}/ruoyi-admin.jar" -ef "${{ env.DEPLOY_PATH }}/${{ env.JAR_FILE }}" ]; then
            echo "Creating backup of current version..."
            mv ${{ env.DEPLOY_PATH }}/ruoyi-admin.jar ${{ env.DEPLOY_PATH }}/ruoyi-admin.jar.bak
          fi

          # 检查是否有正在运行的Java进程，如果有则停止
          # 确保在部署新版本前停止旧服务
          if pgrep -f "java.*${{ env.JAR_FILE }}"; then
            echo "Stopping existing application..."
            sudo pkill -f "java.*${{ env.JAR_FILE }}"
            sleep 10  # 等待10秒确保应用完全停止
          fi

          # 等待确保端口已释放
          sleep 5

          # 启动应用（直接运行JAR文件，不使用systemd服务）
          # 使用GraalVM运行JAR文件，指定开发环境配置
          echo "Starting application directly..."
          sudo -u ${{ env.DEPLOY_USER }} nohup /www/server/java/graalvm-openjdk-17.0.9/bin/java -Dspring.profiles.active=dev -Xmx1024m -Xms512m -jar ${{ env.DEPLOY_PATH }}/${{ env.JAR_FILE }} > ${{ env.DEPLOY_PATH }}/application.log 2>&1 &
          APP_PID=$!
          echo "Application started with PID: $APP_PID"

          # 等待应用启动
          # 给应用一些时间完成启动过程
          sleep 20

          # 检查应用状态
          # 验证应用进程是否成功启动
          if kill -0 $APP_PID 2>/dev/null && pgrep -f "java.*${{ env.JAR_FILE }}" > /dev/null; then
            echo "✓ Application is running successfully!"
            echo "Process details:"
            ps aux | grep java | grep ruoyi
          else
            echo "✗ Application failed to start!"
            echo "Checking application logs:"
            if [ -f "${{ env.DEPLOY_PATH }}/application.log" ]; then
              tail -n 50 ${{ env.DEPLOY_PATH }}/application.log
            else
              echo "Log file does not exist"
            fi
            exit 1  # 如果应用启动失败，则退出脚本
          fi

          # 显示应用程序信息
          # 输出部署信息供验证
          echo "================================"
          echo "Application deployed to ${{ env.DEPLOY_PATH }}"
          echo "Application name: ${{ env.JAR_FILE }}"
          echo "Current status:"
          ps aux | grep java | grep ruoyi
          echo "================================"

          # 显示运行中的Java进程
          # 验证应用程序进程是否正在运行
          echo "Running Java processes:"
          ps aux | grep java | grep ruoyi

          echo "Deployment completed successfully!"
